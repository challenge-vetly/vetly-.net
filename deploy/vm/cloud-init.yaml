#cloud-config
# Preparacao da VM da Vetly: Docker Engine + plugin de Compose.
#
# Roda uma vez, no primeiro boot, antes de qualquer deploy. O script de provisionamento
# espera pelo arquivo-sentinela /opt/vetly/pronto antes de copiar o codigo — sem isso,
# ele tentaria rodar `docker` numa maquina que ainda esta instalando o Docker, e a
# falha apareceria como "command not found" no meio do deploy.
#
# O Docker vem do repositorio oficial, e nao do docker.io do Ubuntu: a versao do
# arquivo do Ubuntu costuma estar velha o bastante para nao trazer o `docker compose`
# como plugin, e ai o compose v2 simplesmente nao existe na maquina.

package_update: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - rsync

write_files:
  - path: /opt/preparar-docker.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Falha ruidosa: um passo que quebra no meio deixaria a VM parecendo pronta.
      set -euxo pipefail

      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
        -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc

      ARQ=$(dpkg --print-architecture)
      CODINOME=$(. /etc/os-release && echo "$VERSION_CODENAME")

      echo "deb [arch=${ARQ} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${CODINOME} stable" \
        > /etc/apt/sources.list.d/docker.list

      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y \
        docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      systemctl enable --now docker

      # O usuario do deploy precisa falar com o socket do Docker sem sudo, senao cada
      # comando do compose viraria um sudo e o rsync do codigo nao teria permissao.
      usermod -aG docker azureuser

      mkdir -p /opt/vetly/app
      chown -R azureuser:azureuser /opt/vetly

      # Sentinela: o provisionador so segue depois que isto existe.
      touch /opt/vetly/pronto

runcmd:
  - /opt/preparar-docker.sh
