# Vetly em uma VM: API, Ollama, MongoDB e proxy com HTTPS automatico.
#
# Quatro containers numa rede interna. So o Caddy publica portas — a API, o Ollama e o
# Mongo nao sao alcancaveis de fora da VM, e e assim que tem de ser: o Ollama nao tem
# autenticacao nenhuma, e expor a 11434 na internet e entregar um LLM aberto a quem
# passar; um Mongo exposto e o alvo classico de varredura automatica.
#
# O contexto de build e a raiz do repositorio (../..), porque e la que o Dockerfile
# espera encontrar o Vetly.slnx e a pasta src/.

name: vetly

services:

  # ── Proxy reverso e terminacao TLS ─────────────────────────────────────────
  # O Caddy obtem e renova o certificado Let's Encrypt sozinho, usando o FQDN que a
  # Azure da ao IP publico. Sem dominio proprio, e o caminho mais curto para um
  # certificado de verdade — e o front-end nao consegue consumir uma API com
  # certificado autoassinado sem gambiarra no cliente.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      VETLY_FQDN: ${VETLY_FQDN:?defina VETLY_FQDN no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Os certificados precisam sobreviver a um `compose down`: o Let's Encrypt tem
      # limite de emissoes por semana, e recriar o volume a cada deploy queimaria a
      # cota rapido.
      - caddy-dados:/data
      - caddy-config:/config
    depends_on:
      - api
    networks:
      - vetly

  # ── A API ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: vetly-api:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Nome do servico na rede do compose. E o que substitui o localhost:11434 do
      # appsettings — dentro do container, localhost seria o proprio container.
      Ollama__BaseUrl: http://ollama:11434
      Storage__Diretorio: /var/lib/vetly/storage
    volumes:
      # Audio de consulta e PDF de documento. O container e descartavel; isto nao e.
      - vetly-storage:/var/lib/vetly/storage
    depends_on:
      ollama:
        condition: service_started
      # O historico do avatar mora no Mongo, mas a API sobe sem ele: o avatar segue
      # servido e o health check fica Degraded. service_started, e nao healthy, pelo
      # mesmo motivo do Ollama.
      mongo:
        condition: service_started
    networks:
      - vetly

  # ── Ollama ─────────────────────────────────────────────────────────────────
  # Sem portas publicadas de proposito: quem fala com ele e a API, pela rede interna.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      # O modelo tem ~5 GB. Sem volume, todo restart baixaria tudo de novo.
      - ollama-modelos:/root/.ollama
    networks:
      - vetly
    # Inferencia em CPU e o gargalo desta VM. O limite existe para o Ollama nao
    # consumir os quatro nucleos e deixar a API sem CPU para responder requisicao
    # nenhuma enquanto gera um prontuario.
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 10G

  # ── MongoDB ────────────────────────────────────────────────────────────────
  # Historico diario do avatar (RN-114). Sem portas publicadas: so a API fala com ele,
  # pela rede interna. Usuario e senha vem do .env (interpolacao do compose), e so
  # estas duas variaveis — o container nao recebe o .env inteiro, que tem a string do
  # Oracle e a chave do JWT.
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USUARIO:-vetly}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_SENHA:?defina MONGO_SENHA no .env}
    volumes:
      # A senha acima so vale na PRIMEIRA subida, quando o volume esta vazio. Trocar a
      # senha depois exige trocar no banco tambem — o script de deploy reaproveita a
      # que ja existe no .env da VM por isso.
      - mongo-dados:/data/db
    networks:
      - vetly
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  vetly-storage:
  mongo-dados:
  ollama-modelos:
  caddy-dados:
  caddy-config:

networks:
  vetly:
    driver: bridge
